# What this module declares about itself.
#
# `aru doctor` checks these against the code: a module that says network = false
# and calls out is rejected. Declaring a permission you do not use is a warning.

name = "arandu-io/examples-invoice"
framework = ">= 0.3"
profiles = ["conventional"]

[permissions]
network = false
filesystem = false
exec = false
migrations = true
